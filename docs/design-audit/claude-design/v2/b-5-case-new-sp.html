<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案B (5) 案件の登録 スマホ — 現場台帳 v2</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/icons-extra.css">
<link rel="stylesheet" href="css/b.css">
</head>
<body>
<div class="v2b">
<header class="b-sp-hero" style="padding-bottom: var(--sp-4); position: sticky; top:0; z-index: 9">
  <div class="b-sp-top"><a href="#" aria-label="案件に戻る"><span class="ico ico-chevron-left" aria-hidden="true"></span></a><h1 class="b-h1">案件を登録</h1></div>
  <p class="sub" style="color: var(--on-primary)">必須の2つ(物件・発注元)は入りました。あと <strong>1</strong> つは任意です。</p>
  <div class="b-prog" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
</header>
<main class="b-sp-body" style="padding-bottom: 176px">
  <section class="b-q">
    <p class="h">物件 <small class="req">必須</small></p>
    <input class="b-input" type="search" aria-label="物件名で探す" placeholder="物件名で探す">
    <div class="b-tiles two">
      <button type="button" class="b-tile" aria-pressed="true">さくらマンション<small>集合住宅・管理会社A(架空)</small></button>
      <button type="button" class="b-tile" aria-pressed="false">サンライズハイツ<small>集合住宅・管理会社A(架空)</small></button>
      <button type="button" class="b-tile" aria-pressed="false">グリーンコーポ板橋<small>集合住宅・管理会社A(架空)</small></button>
      <button type="button" class="b-tile new" aria-pressed="false"><span class="ico ico-plus" aria-hidden="true"></span>新しい物件</button>
    </div>
  </section>
  <section class="b-q">
    <p class="h">部屋 <small>任意</small></p>
    <div class="b-tiles">
      <button type="button" class="b-tile num" aria-pressed="true">203</button><button type="button" class="b-tile num" aria-pressed="false">305</button><button type="button" class="b-tile new" aria-pressed="false"><span class="ico ico-plus" aria-hidden="true"></span>番号</button>
    </div>
    <p class="b-cap">選ばないときは「物件全体・共用部」になります。</p>
  </section>
  <section class="b-q">
    <p class="h">発注元 <small class="req">必須</small></p>
    <div class="b-card b-row" style="border: 2px solid var(--primary); box-shadow:none; padding: var(--sp-3) var(--sp-3) var(--sp-3) var(--sp-4)"><span><strong>管理会社A(架空)</strong><span class="b-cap" style="display:block">この物件のふだんの発注元</span></span><button type="button" class="b-btn sm" style="margin:0">変える</button></div>
  </section>
  <section class="b-q">
    <p class="h">種類</p>
    <div class="b-tiles">
      <button type="button" class="b-tile center" aria-pressed="true">原状回復</button><button type="button" class="b-tile center" aria-pressed="false">リフォーム</button><button type="button" class="b-tile center" aria-pressed="false">クリーニング</button>
      <button type="button" class="b-tile center" aria-pressed="false">修繕</button><button type="button" class="b-tile center" aria-pressed="false">その他</button>
    </div>
  </section>
  <section class="b-q">
    <p class="h">依頼の内容 <small>任意・1行</small></p>
    <input class="b-input" aria-label="依頼の内容" value="退去後の原状回復。立会いは 10/6">
    <p class="b-cap">入居者のお名前は入れません。受付日は今日で入ります。</p>
  </section>
</main>
<div class="b-dock">
  <div><p style="font-weight:800; font-size: var(--fs-h3); line-height:1.4">さくらマンション <span class="b-num">203</span></p><p class="b-cap" style="color: var(--on-primary-muted)">管理会社A(架空)・原状回復・受付は今日</p></div>
  <button type="button" class="b-btn go big block">登録する</button>
</div>
</div>
</body>
</html>
