<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案A (5) 案件の登録 スマホ — 現場台帳 v2</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/icons-extra.css">
<link rel="stylesheet" href="css/a.css">
</head>
<body>
<header class="a-apptop"><a href="#" aria-label="案件に戻る"><span class="ico ico-chevron-left" aria-hidden="true"></span></a><h1 class="ttl">案件を登録</h1></header>
<main class="a-page" style="padding-bottom: 112px">
  <p class="caption">選ぶだけで済む形です。必須は物件と発注元だけ。</p>
  <section class="a-q">
    <div class="h"><span class="n ok"><span class="ico ico-check" aria-hidden="true"></span></span>物件<span class="req">必須</span></div>
    <input class="input" style="min-height: var(--tap-field)" type="search" aria-label="物件名で探す" placeholder="物件名で探す">
    <div class="a-picks2">
      <button type="button" class="pick" aria-pressed="true">さくらマンション<small>集合住宅・管理会社A(架空)</small></button>
      <button type="button" class="pick" aria-pressed="false">サンライズハイツ<small>集合住宅・管理会社A(架空)</small></button>
      <button type="button" class="pick" aria-pressed="false">グリーンコーポ板橋<small>集合住宅・管理会社A(架空)</small></button>
      <button type="button" class="pick a-pick-new" aria-pressed="false"><span class="ico ico-plus" aria-hidden="true"></span>新しい物件</button>
    </div>
  </section>
  <section class="a-q">
    <div class="h"><span class="n ok"><span class="ico ico-check" aria-hidden="true"></span></span>部屋<span class="opt">任意</span></div>
    <div class="picks">
      <button type="button" class="pick num" aria-pressed="true"><span class="ico ico-check" aria-hidden="true"></span>203</button><button type="button" class="pick num" aria-pressed="false">305</button><button type="button" class="pick a-pick-new" aria-pressed="false"><span class="ico ico-plus" aria-hidden="true"></span>番号</button>
    </div>
    <p class="hint">選ばないときは「物件全体・共用部」になります。</p>
  </section>
  <section class="a-q">
    <div class="h"><span class="n ok"><span class="ico ico-check" aria-hidden="true"></span></span>発注元<span class="req">必須</span></div>
    <div class="a-auto"><div><strong>管理会社A(架空)</strong><small>この物件のふだんの発注元</small></div><button type="button" class="btn btn-ghost">変える</button></div>
  </section>
  <section class="a-q">
    <div class="h"><span class="n ok"><span class="ico ico-check" aria-hidden="true"></span></span>種類</div>
    <div class="picks">
      <button type="button" class="pick" aria-pressed="true"><span class="ico ico-check" aria-hidden="true"></span>原状回復</button><button type="button" class="pick" aria-pressed="false">リフォーム</button><button type="button" class="pick" aria-pressed="false">クリーニング</button>
      <button type="button" class="pick" aria-pressed="false">修繕</button><button type="button" class="pick" aria-pressed="false">その他</button>
    </div>
  </section>
  <section class="a-q">
    <div class="h"><span class="n">5</span>依頼の内容<span class="opt">任意・1行</span></div>
    <input class="input" style="min-height: var(--tap-field)" aria-label="依頼の内容" value="退去後の原状回復。立会いは 10/6">
    <p class="hint">入居者のお名前は入れません。受付日は今日で入ります。</p>
  </section>
</main>
<div class="a-bottombar" style="grid-template-columns: 1fr">
  <button type="button" class="btn btn-primary btn-field btn-block">登録する</button>
</div>
</body>
</html>
